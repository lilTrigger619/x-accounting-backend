plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.unionsg'
version = '0.0.1-SNAPSHOT'
description = 'Union accounting suit'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(20)
	}
}

repositories {
	mavenCentral()
}

ext {
    playwrightVersion = '1.49.0'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'

    // Spring Boot web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    //Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Spring Boot validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // lombok
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.3'

    // postgresql
    runtimeOnly 'org.postgresql:postgresql'

    //implementation 'org.hibernate:hibernate-core' // Use latest stable version
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'



    // gson,
    implementation 'com.google.code.gson:gson:2.10.1'

    //MapStruct
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    //thymeleafe
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Playwright (Chromium-based PDF rendering, matches browser CSS - flexbox/grid/clip-path support)
    implementation "com.microsoft.playwright:playwright:$playwrightVersion"
    //spring mail service
        implementation 'org.springframework.boot:spring-boot-starter-mail'


}


tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('installPlaywrightBrowsers', JavaExec) {
	group = 'playwright'
	description = 'Downloads the Chromium browser Playwright needs for PDF generation. Run once per machine/deploy target.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.microsoft.playwright.CLI'
	args = ['install', 'chromium']
}
