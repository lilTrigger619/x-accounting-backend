spring.application.name=xaccounting

# server
server.port=8080

# =============================
# PostgresSQL Datasource
# =============================
spring.datasource.url=jdbc:postgresql://localhost:5432/xaccounting
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================
# JPA / Hibernate
# =============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable swagger UI and API
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

file.upload.dir=uploads
file.max.size=10485760
server.tomcat.max-part-count=30
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# =============================
# Payment Module - Journal Account IDs
# =============================
payment.journal.bank-account-id=1
payment.journal.accounts-receivable-account-id=2
payment.journal.customer-advances-account-id=3

# =============================
# Accounts Payable Module - Journal Account IDs
# =============================
bill.journal.accounts-payable-account-id=4
bill.journal.default-expense-account-id=5
supplierpayment.journal.bank-account-id=1
supplierpayment.journal.accounts-payable-account-id=4
supplierpayment.journal.supplier-advances-account-id=6

