spring.application.name=xaccounting

# Per-machine settings come from environment variables, or from a .env file next to
# where the app is started (git-ignored; copy .env.example to .env). Real environment
# variables win over .env, and the defaults after ':' are used when neither sets one.
spring.config.import=optional:file:.env[.properties]

# server
server.port=${SERVER_PORT:8080}

# Frontend origins allowed to call this API (CORS), comma separated.
# Override per server with the CORS_ALLOWED_ORIGINS env variable, e.g.
# CORS_ALLOWED_ORIGINS=http://10.0.0.5:8081,http://192.168.*:*
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8080}

# =============================
# PostgresSQL Datasource
# =============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:xaccounting}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================
# JPA / Hibernate
# =============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable swagger UI and API
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

file.upload.dir=uploads
file.max.size=10485760
server.tomcat.max-part-count=30
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# =============================
# GL account mappings for automated posting (invoice/bill/payment/payroll/closing) have moved
# out of static properties and into the `accounting_mappings` table (Settings & Setup §8/§46),
# editable at Settings > Accounting Mappings without a restart. See enums/settings/MappingKey
# and service/settings/AccountingMappingService. Defaults matching the values these properties
# used to hold are seeded automatically the first time each key is resolved.
# =============================

# =============================
# Dashboard - accounts treated as "cash on hand / in bank"
# (a set of codes for classification, not a single posting target - stays a plain property)
# =============================
dashboard.cash-account-codes=1000,1010,1020,1030

