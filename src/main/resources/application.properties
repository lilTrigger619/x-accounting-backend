spring.application.name=xaccounting

# server
server.port=8080

# =============================
# PostgresSQL Datasource
# =============================
spring.datasource.url=jdbc:postgresql://localhost:5432/xaccounting
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================
# JPA / Hibernate
# =============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable swagger UI and API
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

file.upload.dir=uploads
file.max.size=10485760
server.tomcat.max-part-count=30
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# =============================
# Payment Module - Journal Account IDs
# NOTE: these must be the AccountEntity.accountId STRING codes (e.g. "1010"),
# NOT raw database primary keys - AccountRequests/JournalService resolve
# CreateJournalLineRequest.accountId via AccountRepository.findByAccountId().
# The previous placeholder values (1,2,3,4,5,6) never matched any seeded
# account and caused every AR/AP posting to fail with "Account not found".
# =============================
payment.journal.bank-account-id=1010
payment.journal.accounts-receivable-account-id=6220
payment.journal.customer-advances-account-id=2080

# =============================
# Accounts Payable Module - Journal Account IDs
# =============================
bill.journal.accounts-payable-account-id=6210
bill.journal.default-expense-account-id=5000
supplierpayment.journal.bank-account-id=1010
supplierpayment.journal.accounts-payable-account-id=6210
supplierpayment.journal.supplier-advances-account-id=1740

# =============================
# Invoice Module - Journal Account IDs
# =============================
invoice.journal.accounts-receivable-account-id=6220
invoice.journal.revenue-account-id=4020
invoice.journal.sales-tax-payable-account-id=2090

# =============================
# Year-End Closing Module - Journal Account IDs
# =============================
accounting.closing.retained-earnings-account-id=3010

# =============================
# Dashboard - accounts treated as "cash on hand / in bank"
# =============================
dashboard.cash-account-codes=1000,1010,1020,1030

# =============================
# Payroll Module - Journal Account IDs
# These are the handful of run-level control accounts that aren't per-component (Salary
# Payable is always the single control account regardless of which earning contributed to
# gross pay). Everything else - which expense account an earning debits, which liability a
# deduction or statutory scheme credits - is configured per PayComponent/StatutoryScheme row,
# not hard-coded here (§33, §53).
# =============================
payroll.journal.salary-payable-account-id=2100
payroll.journal.default-salary-expense-account-id=5040
payroll.journal.employee-tax-payable-account-id=2110
payroll.loan.receivable-account-id=1750
payroll.advance.receivable-account-id=1760
payroll.reimbursement.payable-account-id=2140
payroll.reimbursement.default-expense-account-id=5070
payroll.payment.bank-account-id=1010

